[project]
name = "wealth-insights-demo-backend"
version = "0.1.0"
description = "Wealth Insights Demo — FastAPI backend (multi-provider: OpenAI + Gemini/Vertex)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    # ---- LLM providers ----
    "openai>=1.51.0",
    "google-genai>=1.0.0",
    "google-auth>=2.34.0",
    # ---- Agentic framework ----
    "google-adk>=1.0.0",
    "litellm>=1.51.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
